# 宿主机上的宝塔 nginx 做 HTTPS 终止，再经 Docker 网关（172.16.0.0/12）转发进来：
# 只信任这条链路带来的真实客户端 IP 和协议，直接访问容器端口的请求不受影响（伪造的头不生效）
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 127.0.0.1;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

geo $realip_remote_addr $lemon_from_proxy {
    default 0;
    172.16.0.0/12 1;
    127.0.0.1 1;
}
# 传给后端的协议：经宝塔来的 https 请求保持 https，后端才不会把同源请求当成跨域
map "$lemon_from_proxy:$http_x_forwarded_proto" $lemon_proto {
    default $scheme;
    "1:https" https;
}
