# 单页应用：history 路由回落到 index.html；带 hash 的静态资源长缓存，index.html 不缓存
# 注意：这里只用 expires 设置缓存，不要在 location 里写 add_header——
# Nginx 的 add_header 一旦在 location 里出现，就不再继承 server 级的 HSTS / X-Frame-Options 等安全头
location / {
    try_files $uri $uri/ /index.html;
}
location = /index.html {
    expires -1;
}
location /assets/ {
    expires 1y;
}
