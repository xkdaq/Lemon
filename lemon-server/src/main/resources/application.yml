server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: lemon-server
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL:jdbc:mysql://localhost:3306/lemon?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&createDatabaseIfNotExist=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DB:0}
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# Sa-Token：app 端与 admin 端共用配置，靠 loginType 隔离（见 StpAppUtil / StpAdminUtil）
sa-token:
  token-name: Authorization
  token-prefix: Bearer
  timeout: 2592000          # 30 天
  active-timeout: -1
  is-concurrent: true
  is-share: false
  token-style: simple-uuid
  is-read-cookie: false
  is-print: false

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

lemon:
  # 首次启动时若没有任何管理员，自动创建该账号；上线前务必通过环境变量改掉
  admin:
    init-username: ${ADMIN_INIT_USERNAME:admin}
    init-password: ${ADMIN_INIT_PASSWORD:admin123}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:*}
  # 上传文件：开发期存本地目录，由后端 /uploads/** 提供访问；上线后可换对象存储（实现 FileStorage 即可）
  # 短信验证码（Spug 推送助手）：SMS_SPUG_URL 填控制台「短信验证码」模板的完整调用 URL；
  # 选的是带有效时长的模板时，SMS_SPUG_MINUTES 填 5（验证码有效 5 分钟）
  sms:
    spug-url: ${SMS_SPUG_URL:}
    minutes: ${SMS_SPUG_MINUTES:}
    log-code: false
  upload:
    dir: ${UPLOAD_DIR:./uploads}
    url-prefix: ${UPLOAD_URL_PREFIX:/uploads}
    max-size-mb: 5
