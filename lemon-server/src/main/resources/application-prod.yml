# 生产环境：docker compose 中通过环境变量注入敏感配置，见 deploy/.env.example
server:
  # 在 Nginx 之后，按 X-Forwarded-Proto/Host（含端口）/For 还原协议、域名端口和真实客户端 IP；
  # 用 framework 而不是 native：native（Tomcat）在没有 X-Forwarded-Port 时会把端口重置为 80/443，非标准端口下同源请求会被误判为跨域
  forward-headers-strategy: framework
  shutdown: graceful
  tomcat:
    max-swallow-size: 25MB

spring:
  lifecycle:
    timeout-per-shutdown-phase: 20s
  datasource:
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}

logging:
  level:
    root: info
    com.lemon: info

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

lemon:
  upload:
    dir: ${UPLOAD_DIR:/data/uploads}
  cors:
    # 网页端和管理端都通过各自域名同源访问接口，一般不需要跨域；小程序不受 CORS 限制
    allowed-origins: ${CORS_ALLOWED_ORIGINS:https://*.example.com}
